name: Testes

on:
  pull_request:
  push:
    branches: [apoiarcred-consultas-mvp]

jobs:
  frontend:
    name: Painel (jsdom)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do painel
        run: |
          for t in tests/*.cjs; do
            echo "::group::$t"; node "$t"; echo "::endgroup::"
          done

  python:
    name: VPS (Python)
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: vps:tests
      SUPABASE_URL: https://example.invalid
      SUPABASE_SERVICE_ROLE_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tests mock the browser and the providers; Playwright/boto3 are not needed here.
      # Installer tests simulate a root shell (the real installer refuses to run otherwise),
      # so the suite runs under sudo with the same environment and Python.
      - name: Testes dos workers, API e instalador
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            # sudo drops PYTHONPATH even with -E, so pass it explicitly.
            sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" timeout 300 python -m unittest "tests.$(basename "$t" .py)"
            echo "::endgroup::"
          done

  sql:
    name: Banco (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Esquema, migrações e testes SQL
        run: bash tests/sql/run.sh
